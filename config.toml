[preferences]
wallpaper = 4       # Number for a bundled wallpaper, or a path to an image.
neovim = true       # Install Neovim and use github.com/Letder40/nvim-config.
animations = true   # Install and configure Picom with custom animations.
tmux = true         # link the repository's tmux configuration and install tpm.
zshrc = true        # link the repository's zsh configuration and install needed dependencies.

[preferences.icon_theme]
name = "Papirus-Dark"
package = "papirus-icon-theme"

[preferences.font]
name = "FiraCode Nerd Font Mono"
package = "ttf-firacode-nerd"

[preferences.terminal]
name = "kitty"
package = "*"

[preferences.browser]
name = "firefox"
package = "*"

[packages]
utils = [
    "eza",
    "zoxide",
    "fzf",
    "thefuck",
    "fd",
    "ripgrep",
    "bat",
    "pyenv",
]

others = [
    "flameshot",
    "rofi",
    "zathura",
    "zathura-pdf-mupdf",
    "pavucontrol",
    "rustup",
    "npm",
]

# Larger graphical applications; remove any you do not want installed.
desktop = [
    "discord",
    "bitwarden",
    "libreoffice-fresh",
]

[packages.init]
services = [
    { name = "NetworkManager", package = "networkmanager" },
    { name = "bluetooth", package = "bluez" },
    { name = "dunst", package = "*", user = true },
    { name = "ssh-agent.socket", package = "openssh", user = true },
]

autostart = [
    { exec = "fcitx5 -d", package = "*" },
    { exec = "udiskie --appindicator", package = "*" },
    { exec = "blueman-applet", package = "blueman" },
    { exec = "nm-applet", package = "network-manager-applet" },
    { exec = "volumeicon", package = "*" },
    { exec = "setxkbmap es" },
]

# The setup stops if a base package cannot be installed.
[packages.base]
required = [
    "qtile",
    "zsh",
    "git",
    "curl",
    "wget",
    "xsettingsd",
    "python-psutil",
]

system = [
    "lightdm-gtk-greeter",
    "pipewire",
    "pipewire-pulse",
    "pipewire-alsa",
    "wireplumber",
    "xdg-desktop-portal-gtk",
]

[packages.base.init]
services = [
    { name = "lightdm", package = "*" },
]

autostart = [
    { exec = "xsettingsd", package = "*" },
]

# zshrc config dependencies
[[zshrc.package]]
name = "zsh"

[[zshrc.curl]]
url = "https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh"
params = "--keep-zshrc"
check_path = "~/.oh-my-zsh"

[[zshrc.git]]
src = "https://github.com"
repo = "zsh-users/zsh-syntax-highlighting.git"
path = "~/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting"

[[zshrc.git]]
src = "https://github.com"
repo = "romkatv/powerlevel10k.git"
path = "~/.oh-my-zsh/custom/themes/powerlevel10k"

# tmux config dependencies
[[tmux.package]]
name = "tmux"

[[tmux.git]]
src = "https://github.com"
repo = "tmux-plugins/tpm"
path = "~/.tmux/plugins/tpm"

# Shell installers downloaded with curl and run as the current user.
[[curl]]
url = "https://bun.com/install"
check_path = "~/.bun"
