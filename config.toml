[preferences]
terminal = "kitty"    # valid pacman package name
browser = "firefox"   # valid pacman package name
wallpaper = 4         # number -> will search ^wallpaper${number}\.* in ../wallpapers; if string -> absolute path to wallpaper image
neovim = true         # Clones and setup this config https://github.com/Letder40/nvim-config/
animations = true     # boolean setup picom
icon_theme = "Papirus-Dark"


[packages]
# Changing this may break some features or the complete setup
required = [
    "qtile",
    "lightdm",
    "lightdm-gtk-greeter",
    "zsh",
    "git",
    "curl",
    "wget",
    "eza",
    "zoxide",
    "fd",
    "ripgrep",
    "fzf",
    "thefuck",
    "zoxide",
    "pyenv",
    "python-psutil",
    "zsh-syntax-highlighting",
    "papirus-icon-theme",
    "xsettingsd",
    "flameshot",
    "rofi",
]

# will be installed and auto started
# Change as much as you want
autostart = [
    { exec="xsettingsd", package="xsettingsd" },
    { exec="fcitx5 -d", package="fcitx5" },
    { exec="volumeicon", package="volumeicon" },
    { exec="udiskie --appindicator", package="udiskie" },
    { exec="blueman-applet", package="blueman" },
    { exec="nm-applet", package="network-manager-applet" },
    { exec="setxkbmap es", package="" },
]

# The following packages will be installed on setup accepts an array of strings with valid software names instalable with pacman
# Change as much as you want
utils = [
    "bat",
    "tmux",
    "zathura",
] 

desktop = [
    "discord",
    "bitwarden",
    "zathura",
] 

# software that will be installed using curl -fsSL ... | sh
[[curl]]
url = "https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh"
params = "--keep-zshrc"
check_path = "~/.oh-my-zsh"
required = true

[[curl]]
url = "https://bun.com/install"
check_path = "~/.bun"
required = false

# repositories that will be cloned in the defined path
[[git]]
src = "https://github.com"
repo = "zsh-users/zsh-syntax-highlighting.git"
path = "~/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting"
required = true

[[git]]
src = "https://github.com"
repo = "romkatv/powerlevel10k.git"
path = "~/.oh-my-zsh/custom/themes/powerlevel10k"
required = true

[[git]]
src = "https://github.com"
repo = "tmux-plugins/tpm"
path = "~/.tmux/plugins/tpm"
required = false

